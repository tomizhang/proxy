name: Build iOS MAUI App

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "src/Proxy.Client.Maui/**"
      - "src/Proxy.Common/**"
      - "src/Proxy.Client.Core/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "src/Proxy.Client.Maui/**"
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-ios:
    name: Build & Package iOS App (MAUI)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET SDK (9.0.x)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 📱 Setup Xcode & iOS Platform
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* || true
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch || true
          xcrun simctl list runtimes || true

      - name: 🛠️ Install .NET MAUI iOS Workload
        run: |
          dotnet workload restore src/Proxy.Client.Maui/Proxy.Client.Maui.csproj /p:BuildingForIOS=true || dotnet workload install maui-ios --no-cache

      - name: 📦 Restore Dependencies
        run: |
          dotnet restore src/Proxy.Client.Maui/Proxy.Client.Maui.csproj \
            /p:BuildingForIOS=true \
            /p:Platform=iPhone \
            /p:DevicePlatform=iphoneos \
            /p:RuntimeIdentifier=ios-arm64 \
            /p:ValidateXcodeVersion=false \
            /p:_ValidateXcodeVersion=false \
            /p:PublishTrimmed=true \
            /p:MtouchLink=SdkOnly \
            /p:EnableCodeSigning=false

      - name: 📱 Publish iOS App (Unsigned for Sideloading)
        run: |
          dotnet publish src/Proxy.Client.Maui/Proxy.Client.Maui.csproj \
            -c ${{ github.event.inputs.build_configuration || 'Release' }} \
            -f net9.0-ios \
            /p:Platform=iPhone \
            /p:DevicePlatform=iphoneos \
            /p:RuntimeIdentifier=ios-arm64 \
            /p:BuildingForIOS=true \
            /p:ValidateXcodeVersion=false \
            /p:_ValidateXcodeVersion=false \
            /p:PublishTrimmed=true \
            /p:MtouchLink=SdkOnly \
            /p:EnableCodeSigning=false \
            /p:CodesignKey="" \
            /p:CodesignProvision=""

      - name: 📦 Package Unsigned .ipa for Sideloading (AltStore / TrollStore / Sideloadly)
        run: |
          mkdir -p build-output
          DEV_APP_PATH=$(find src/Proxy.Client.Maui/bin -name "*.app" | head -n 1)
          if [ -d "$DEV_APP_PATH" ]; then
            echo "Found Device App at $DEV_APP_PATH"
            mkdir -p build-output/Payload
            cp -R -p "$DEV_APP_PATH" build-output/Payload/
            cd build-output
            zip -r -y "CloudflareProxy-iOS-Unsigned.ipa" Payload
            rm -rf Payload
            cd ..
          else
            echo "⚠️ Device .app not found, skipping IPA packaging"
          fi

      - name: 🔏 Sign .ipa with Apple Developer Certificate (if Secrets provided)
        if: env.P12_BASE64 != '' && env.PROVISION_PROFILE_BASE64 != ''
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          echo "Found signing secrets, installing zsign..."
          brew install zsign
          python3 -c "import os, base64; open('build-output/cert.p12', 'wb').write(base64.b64decode(os.environ['P12_BASE64']))"
          python3 -c "import os, base64; open('build-output/profile.mobileprovision', 'wb').write(base64.b64decode(os.environ['PROVISION_PROFILE_BASE64']))"
          zsign -k build-output/cert.p12 -p "$P12_PASSWORD" -m build-output/profile.mobileprovision -o build-output/CloudflareProxy-iOS-Signed.ipa build-output/CloudflareProxy-iOS-Unsigned.ipa
          rm -f build-output/cert.p12 build-output/profile.mobileprovision
          echo "✅ Successfully created CloudflareProxy-iOS-Signed.ipa"

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CloudflareProxy-iOS-Packages
          path: |
            build-output/*
            build-output-log.txt
          retention-days: 14

      - name: 🚀 Release Assets (if published release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
